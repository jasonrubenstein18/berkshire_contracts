app = "berkshire-contracts"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  COLBERT_DEVICE = "cpu"
  HF_HOME = "/opt/hf"
  HF_HUB_CACHE = "/opt/hf/hub"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "4096mb"
